# Disposable PipeWire daemon used by scripts/with-test-pipewire.sh.
#
# Keep this deliberately independent from the user's PipeWire session: there
# are no ALSA, PulseAudio, Bluetooth, JACK, or WirePlumber modules here.

context.properties = {
    core.daemon = true
    core.name = pipewire-0

    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum = 256
    default.clock.min-quantum = 32
    default.clock.max-quantum = 1024

    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-access }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]

context.objects = [
    # The dummy driver gives the null sink a graph driver without hardware.
    { factory = spa-node-factory
        args = {
            factory.name = support.node.driver
            node.name = peq-a05-dummy-driver
            node.group = pipewire.dummy
            node.sync-group = sync.dummy
            priority.driver = 200000
        }
    }

    # A stereo sink with fixed channel positions and no physical device.
    { factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = peq-a05-null-sink
            node.description = "peq A05 test null sink"
            media.class = Audio/Sink
            audio.format = F32
            audio.rate = 48000
            audio.channels = 2
            audio.position = [ FL FR ]
            node.always-process = true
            monitor.passthrough = false
            adapter.auto-port-config = {
                mode = dsp
                monitor = false
                control = false
                position = preserve
            }
        }
    }
]
