[package]
name = "pequi"
version = "0.1.0"
edition = "2021"
description = "Terminal picker and editor for parametric EQ curves, played through EasyEffects"
license = "MIT"
repository = "https://github.com/Iwakura9/pequi"
readme = "README.md"
keywords = ["equalizer", "easyeffects", "tui", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
ratatui = "0.29"
crossterm = "0.28"
